version: "3.8"

networks:
  trading-net:
    driver: bridge
  kafka-ec2-net:
    external: true
    name: kafka-ec2-net

volumes:
  postgres-data:
  analytics-data:

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ANALYTICS_READER_PASSWORD: ${POSTGRES_ANALYTICS_READER_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  fauxnance-mock:
    build: ./fauxnance-mock
    container_name: fauxnance-mock
    restart: unless-stopped
    environment:
      PORT: 5000
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY}
      FAUXNANCE_DAILY_LIMIT: ${FAUXNANCE_DAILY_LIMIT}
    ports:
      - "${FAUXNANCE_MOCK_PORT}:5000"
    networks:
      - trading-net

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${AUTH_SERVICE_PORT}:3000"
    networks:
      - trading-net

  node-auth-stub:
    build: ./node-auth-stub
    container_name: node-auth-stub
    restart: unless-stopped
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
    ports:
      - "${NODE_AUTH_STUB_PORT}:3001"
    networks:
      - trading-net

  trade-api:
    build: ./trade-api
    container_name: trade-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fauxnance-mock:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS}
      KAFKA_TOPIC_TRADE_EVENTS: ${KAFKA_TOPIC_TRADE_EVENTS}
      KAFKA_TOPIC_MARKET_DATA: ${KAFKA_TOPIC_MARKET_DATA}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY}
    ports:
      - "${TRADE_API_PORT}:8081"
    networks:
      - trading-net
      - kafka-ec2-net

  trade-executor:
    build: ./trade-executor
    container_name: trade-executor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fauxnance-mock:
        condition: service_started
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS}
      KAFKA_TOPIC_TRADE_EVENTS: ${KAFKA_TOPIC_TRADE_EVENTS}
      KAFKA_TOPIC_MARKET_DATA: ${KAFKA_TOPIC_MARKET_DATA}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY}
    ports:
      - "${TRADE_EXECUTOR_PORT}:8082"
    networks:
      - trading-net
      - kafka-ec2-net

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - auth-service
      - trade-api
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - trading-net

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_ANALYTICS_USER: analytics_reader
      POSTGRES_ANALYTICS_READER_PASSWORD: ${POSTGRES_ANALYTICS_READER_PASSWORD}
    volumes:
      - analytics-data:/data
    networks:
      - trading-net

  analytics-dashboard:
    build: ./analytics-service
    container_name: analytics-dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "src/webapp.py", "--server.address=0.0.0.0", "--server.port=8501"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_ANALYTICS_USER: analytics_reader
      POSTGRES_ANALYTICS_READER_PASSWORD: ${POSTGRES_ANALYTICS_READER_PASSWORD}
    ports:
      - "${ANALYTICS_DASHBOARD_PORT}:8501"
    volumes:
      - analytics-data:/data
    networks:
      - trading-net
